<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{문서 제목}}</title>
<!-- 자산 = choihong-xvive/doc-assets. 공유/배포본은 @main 대신 커밋 SHA로 고정(AUTHORING.md §5). -->
<script src="https://cdn.jsdelivr.net/gh/choihong-xvive/doc-assets@main/theme-init.js"></script>
</head>
<body>

<button id="themeToggle" type="button" aria-label="테마 전환"></button>
<button id="toTop" type="button" aria-label="맨 위로" title="맨 위로">↑</button>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">{{브랜드/팀}}</div>
    <div class="sidebar-title">{{사이드바<br>제목}}</div>
    <span class="sidebar-version">v1.0</span>
    <nav class="sidebar-nav"><ul id="nav"></ul></nav>   <!-- ## 섹션에서 자동 생성됨 -->
    <div class="sidebar-meta">
      <strong>Issued</strong> {{YYYY.MM}}<br>
      <strong>Target</strong> {{대상 독자}}<br>
      <strong>Scope</strong> {{범위}}
    </div>
  </aside>

  <main class="main">
    <div class="md-body" id="content"></div>   <!-- 여기에 렌더됨. 비워둘 것 -->
  </main>
</div>

<!-- ===================================================================
     콘텐츠 = 마크다운. 편집은 이 <script id="source"> 안에서만. (규약: AUTHORING.md)
     · 섹션      = "## 제목"                  (사이드바 자동)
     · 소제목    = "### 제목"
     · 콜아웃    = "> [!INFO|OK|WARN|DANGER] 제목"  + 빈 ">" 줄 + 본문
     · 단계      = "1. 2. 3." 숫자 리스트       (원형 번호로 렌더)
     · 표/코드   = 일반 마크다운 (표는 자동 래핑, 코드펜스는 다크 박스)
     · 표지/비교 = 아래처럼 소량 inline HTML (cover / compare)
     =================================================================== -->
<script type="text/markdown" id="source">
<header class="cover">
  <div class="cover-eyebrow">{{카테고리 / EYEBROW}}</div>
  <h1 class="cover-title">{{표지<br>제목}}</h1>
  <p class="cover-subtitle">{{한 문장 요약 — 이 문서가 무엇을 다루고 누구를 위한 것인지.}}</p>
  <div class="cover-meta">
    <div><span>Version</span><b>v1.0</b></div>
    <div><span>Issued</span><b>{{YYYY.MM}}</b></div>
    <div><span>Status</span><b>Draft</b></div>
  </div>
</header>

> [!INFO] TL;DR
>
> - {{핵심 요점 1}}
> - {{핵심 요점 2}}

## {{첫 번째 섹션}}

{{본문…}} **굵게**, `인라인 코드`, [링크](https://example.com) 모두 일반 마크다운.

| 컬럼 A | 컬럼 B |
|---|---|
| 값 1 | 값 2 |

## {{두 번째 섹션}}

1. **1단계** — 숫자 리스트는 원형 번호로 렌더됨.
2. **2단계** — 설명.

<div class="compare">
  <div class="compare-col compare-bad"><div class="compare-label">❌ 나쁨</div><p>{{안티패턴}}</p></div>
  <div class="compare-col compare-good"><div class="compare-label">✅ 좋음</div><p>{{권장}}</p></div>
</div>

---

*{{문서 푸터 · 출처/참조}}*
</script>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/choihong-xvive/doc-assets@main/doc.js"></script>

</body>
</html>
